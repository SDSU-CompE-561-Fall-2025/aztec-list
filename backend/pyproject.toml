[project]
name = "aztec-list"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "fastembed>=0.8.0",
    "jinja2>=3.1.6",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.1",
    "mcp>=1.27.1",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "qdrant-client>=1.18.0",
    "resend>=2.30.1",
    "sentry-sdk[fastapi]>=2.59.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.14",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line too long (handled by line-length)
    "COM812", # missing trailing comma (handled by formatter)
    "D203",   # no blank line before class docstrings
    "D212",   # keep summary on first line
    "D413",   # blank line after last docs section
    "D1",     # ignore all "missing docstring" rules
    "TD",     # ignore all TODO rules
    "FIX002", # line contains TODO
    "UP042",  # str+Enum -> StrEnum: behavior-changing for DB/API enums, migrate separately
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts set up sys.path before importing the app package.
"scripts/*" = ["INP001", "E402"]
# Alembic loads env.py and versions/*.py dynamically, so they should not be packages.
"alembic/env.py" = ["INP001"]
"alembic/versions/*.py" = [
    "INP001",   # implicit namespace package (alembic loads these directly)
    "E501",     # long lines from autogenerated DDL
    "UP006",    # legacy typing.List/Tuple style from alembic template
    "UP007",    # legacy Union style from alembic template
    "UP035",    # legacy typing imports from alembic template
    "Q",        # single-quoted strings from alembic template
    "D",        # docstring style on autogenerated revisions
    "I",        # import order from alembic template
    "RUF",      # misc ruff style from alembic template
    "COM812",   # trailing commas from alembic template
    "ANN201",   # return annotation on upgrade()/downgrade()
    "ARG001",   # unused args in callable templates
    "F401",     # unused imports in template scaffold
    "ERA001",   # commented-out code in template comments
    "W291",     # trailing whitespace in autogenerated headers
    "PLR0915",  # large upgrade()/downgrade() bodies on big migrations
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for workflows",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
