name: Dependabot auto-merge

# Auto-merges Dependabot PRs for minor + patch updates once all required
# status checks pass. Major version bumps are left for manual review.
#
# Prerequisites (one-time, in repo Settings):
#   - General → "Allow auto-merge" must be enabled.
#   - Branch protection on `main` should require the CI checks
#     (Security Audit, CodeQL, gitleaks) so auto-merge waits for them.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (minor + patch only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
